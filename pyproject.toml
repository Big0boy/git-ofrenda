[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ofrenda"
version = "1.0.0"
description = "A Día de los Muertos altar for the code your repository deleted, with calaveras and séances from a local open-weight model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["git", "ollama", "local-llm", "dia-de-los-muertos", "halloween", "dead-code"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
git-ofrenda = "ofrenda.cli:main"

[tool.setuptools]
packages = ["ofrenda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
